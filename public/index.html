<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%276.5%27 fill=%27%23ffd800%27 stroke=%27%23000%27 stroke-width=%272%27/%3E%3Ccircle cx=%278%27 cy=%278%27 r=%273%27 fill=%27none%27 stroke=%27%23000%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app/style.css">
<title>Roundnet Taiwan Pickups · 台灣 Roundnet 揪團</title>
<meta name="description" content="Find and join roundnet pickup games in Taiwan. 找台灣的 Roundnet 揪團。">
</head>
<body>
<div class="wrap">
<div id="hdr"></div>

<div class="win">
  <div class="bar" data-i18n="upcoming"></div>
  <div class="body">
    <p>
      <select id="city" aria-label="City"></select>
      &nbsp; <a class="btn" href="/new" data-i18n="nav_new"></a>
    </p>
    <div class="inset" id="list" style="padding:0"><p style="padding:8px" data-i18n="loading"></p></div>
  </div>
</div>

<div id="ftr"></div>
</div>
<script src="/app/i18n.js"></script>
<script src="/app/app.js"></script>
<script>
renderChrome();

var city = param('city') || '';
var sel = $('city');
sel.innerHTML = '<option value="">' + esc(t('all_cities')) + '</option>' +
  CITIES.map(function (c) { return '<option value="' + c + '">' + esc(cityName(c)) + '</option>'; }).join('');
sel.value = city;
sel.onchange = function () { location.search = sel.value ? '?city=' + sel.value : ''; };

api('/api/events' + (city ? '?city=' + encodeURIComponent(city) : '')).then(function (rows) {
  if (!rows.length) {
    $('list').innerHTML = '<p style="padding:8px">' + esc(t('none')) + ' <a href="/new">' + esc(t('nav_new')) + '</a></p>';
    return;
  }
  $('list').innerHTML =
    '<table class="list"><tr>' +
      '<th>' + esc(t('col_when')) + '</th><th>' + esc(t('col_what')) + '</th>' +
      '<th class="hide-sm">' + esc(t('col_city')) + '</th><th>' + esc(t('col_players')) + '</th></tr>' +
    rows.map(function (ev) {
      return '<tr>' +
        '<td class="nowrap">' + esc(fmtWhen(ev)) + '</td>' +
        '<td><a href="/event?id=' + esc(ev.id) + '"><b>' + esc(ev.title) + '</b></a><br>' +
          '<span class="small">' + esc(ev.place_name) + ' &middot; ' + esc(levelName(ev.level)) + '</span></td>' +
        '<td class="hide-sm">' + esc(cityName(ev.city)) + '</td>' +
        '<td class="nowrap">' + esc(playersText(ev.count, ev.max_players)) + '</td>' +
      '</tr>';
    }).join('') + '</table>';
}).catch(function (err) {
  showMsg($('list'), esc(errText(err)), 'err');
});
</script>
</body>
</html>
