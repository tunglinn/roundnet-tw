<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%276.5%27 fill=%27%23ffd800%27 stroke=%27%23000%27 stroke-width=%272%27/%3E%3Ccircle cx=%278%27 cy=%278%27 r=%273%27 fill=%27none%27 stroke=%27%23000%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app/style.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#000080">
<meta name="apple-mobile-web-app-title" content="Roundnet TW">
<title>Roundnet Taiwan Pickups · 台灣 Roundnet 揪團</title>
<meta name="description" content="Find and join roundnet pickup games in Taiwan. 找台灣的 Roundnet 揪團。">
</head>
<body>
<div class="wrap">
<div id="hdr"></div>

<div class="win">
  <div class="bar" data-i18n="upcoming"></div>
  <div class="body">
    <p>
      <select id="city" aria-label="City"></select>
      &nbsp; <a class="btn" href="/new" data-i18n="nav_new"></a>
    </p>
    <div class="inset" id="list" style="padding:0"><p style="padding:8px" data-i18n="loading"></p></div>
  </div>
</div>

<div class="win" id="pastebox" style="display:none">
  <div class="bar" data-i18n="paste_title"></div>
  <div class="body">
    <p class="small" data-i18n="paste_help"></p>
    <form id="pasteform" class="copyrow">
      <input type="text" id="pastelink" placeholder="https://…/event?id=…&amp;edit=…">
      <button type="submit" data-i18n="btn_open"></button>
    </form>
    <div id="pastemsg"></div>
  </div>
</div>

<div id="ftr"></div>
</div>
<script src="/app/i18n.js"></script>
<script src="/app/app.js"></script>
<script>
renderChrome();

// In the installed app (home screen), the browser's saved edit links aren't available.
if (isStandalone()) {
  $('pastebox').style.display = '';
  $('pasteform').onsubmit = function (e) {
    e.preventDefault();
    try {
      var u = new URL($('pastelink').value.trim());
      var id = u.searchParams.get('id'), edit = u.searchParams.get('edit');
      if (/\/event(\.html)?$/.test(u.pathname) && id && edit) {
        location.href = '/event?id=' + encodeURIComponent(id) + '&edit=' + encodeURIComponent(edit);
        return;
      }
    } catch (err) {}
    showMsg($('pastemsg'), esc(t('err_bad_link')), 'err');
  };
}

var city = param('city') || '';
var sel = $('city');
sel.innerHTML = '<option value="">' + esc(t('all_cities')) + '</option>' +
  CITIES.map(function (c) { return '<option value="' + c + '">' + esc(cityName(c)) + '</option>'; }).join('');
sel.value = city;
sel.onchange = function () { location.search = sel.value ? '?city=' + sel.value : ''; };

function statusHtml(ev) {
  var st = pickupStatus(ev);
  return '<span class="small ' + (st.cancelled ? 'st-cancelled' : st.confirmed ? 'st-on' : 'st-pending') + '">' + esc(statusText(st, true)) + '</span>';
}

api('/api/events' + (city ? '?city=' + encodeURIComponent(city) : '')).then(function (rows) {
  if (!rows.length) {
    $('list').innerHTML = '<p style="padding:8px">' + esc(t('none')) + ' <a href="/new">' + esc(t('nav_new')) + '</a></p>';
    return;
  }
  $('list').innerHTML =
    '<table class="list"><tr>' +
      '<th>' + esc(t('col_when')) + '</th><th>' + esc(t('col_what')) + '</th>' +
      '<th class="hide-sm">' + esc(t('col_city')) + '</th><th>' + esc(t('col_players')) + '</th></tr>' +
    collapseSeries(rows).map(function (ev) {
      var link = '/event?id=' + esc(ev.id);
      return '<tr>' +
        '<td class="nowrap' + (ev.cancelled_at ? ' struck' : '') + '">' + esc(fmtWhen(ev)) + '</td>' +
        '<td><a href="' + link + '"><b' + (ev.cancelled_at ? ' class="struck"' : '') + '>' + esc(ev.title) + '</b></a>' +
          (ev.series_id ? ' <span class="repeat">' + esc(weeklyLabel(ev)) + '</span>' : '') + '<br>' +
          '<span class="small">' + esc(ev.place_name) + ' &middot; ' + esc(levelName(ev.level)) + '</span>' +
          (ev.more ? '<br><a class="small" href="' + link + '">' + esc(moreText(ev.more)) + '</a>' : '') + '</td>' +
        '<td class="hide-sm">' + esc(cityName(ev.city)) + '</td>' +
        '<td>' + esc(playersText(ev.count, ev.max_players)) + '<br>' + statusHtml(ev) + '</td>' +
      '</tr>';
    }).join('') + '</table>';
}).catch(function (err) {
  showMsg($('list'), esc(errText(err)), 'err');
});
</script>
</body>
</html>
