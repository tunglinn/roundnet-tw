<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%276.5%27 fill=%27%23ffd800%27 stroke=%27%23000%27 stroke-width=%272%27/%3E%3Ccircle cx=%278%27 cy=%278%27 r=%273%27 fill=%27none%27 stroke=%27%23000%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app/style.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#000080">
<meta name="apple-mobile-web-app-title" content="Roundnet TW">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<title>Add a pickup · Roundnet Taiwan Pickups</title>
</head>
<body>
<div class="wrap">
<div id="hdr"></div>

<div class="win">
  <div class="bar" id="formtitle" data-i18n="new_title"></div>
  <div class="body">
    <form id="form" novalidate>
      <!-- Where: city first, so the map can zoom there before you drop the pin -->
      <label for="city" data-i18n="f_city"></label>
      <select id="city" required></select>

      <label><span data-i18n="f_pin"></span> &nbsp; <span id="pinstate" class="small"></span></label>
      <div id="map" class="map small"></div>
      <p class="small"><button type="button" id="locate" data-i18n="f_mylocation"></button></p>

      <label for="place" data-i18n="f_place"></label>
      <input type="text" id="place" maxlength="100" required data-i18n-ph="ph_place">

      <!-- What -->
      <label for="title" data-i18n="f_title"></label>
      <input type="text" id="title" maxlength="80" required data-i18n-ph="ph_title">
      <div class="small" data-i18n="bilingual_tip"></div>

      <!-- When -->
      <label data-i18n="f_date"></label>
      <div id="cal" class="cal"></div>
      <div class="small" id="datepicked"></div>

      <div class="row">
        <div>
          <label for="start"><span data-i18n="f_start"></span> <span class="small" data-i18n="tz_note"></span></label>
          <select id="start"></select>
        </div>
        <div>
          <label for="duration" data-i18n="f_duration"></label>
          <select id="duration"></select>
          <div class="small" id="endsat">&nbsp;</div>
        </div>
      </div>

      <div id="repeatbox">
        <div class="row">
          <div><label for="repeat" data-i18n="f_repeat"></label><select id="repeat"></select></div>
          <div id="untilbox" style="display:none"><label for="until" data-i18n="f_until"></label><input type="date" id="until"></div>
        </div>
        <div class="small" id="untilhelp" style="display:none" data-i18n="until_help"></div>
      </div>

      <!-- Who -->
      <div class="row">
        <div><label for="level" data-i18n="f_level"></label><select id="level"></select></div>
        <div><label for="max" data-i18n="f_max"></label><input type="number" id="max" min="2" max="100" style="width:7em"></div>
      </div>

      <label for="min" data-i18n="f_min"></label>
      <input type="number" id="min" min="2" max="100" style="width:7em">
      <div class="small" data-i18n="min_help"></div>

      <label for="contact" data-i18n="f_contact"></label>
      <input type="text" id="contact" maxlength="100">

      <label for="notes" data-i18n="f_notes"></label>
      <textarea id="notes" maxlength="1000" data-i18n-ph="ph_notes"></textarea>

      <div id="scopebox" style="display:none">
        <label data-i18n="scope_label"></label>
        <label class="chk" style="font-weight:normal"><input type="radio" name="scope" value="one" checked> <span data-i18n="scope_one"></span></label>
        <label class="chk" style="font-weight:normal"><input type="radio" name="scope" value="future"> <span data-i18n="scope_future"></span></label>
      </div>

      <div id="errors"></div>
      <div class="actions">
        <button type="submit" id="submit" data-i18n="btn_create"></button>
        <a href="/" id="cancel" data-i18n="btn_cancel"></a>
      </div>
    </form>
  </div>
</div>

<div id="ftr"></div>
</div>
<script src="/app/i18n.js"></script>
<script src="/app/app.js"></script>
<script>
renderChrome();

// Edit mode: /new?id=… with the edit token in localStorage.
var editId = param('id');
var token = editId ? storeGet('edit:' + editId) : null;
if (editId && !token) location.replace('/event?id=' + encodeURIComponent(editId));

// Where the map jumps to when a city is picked: [lat, lng, zoom].
var CITY_VIEW = {
  taipei: [25.04, 121.55, 12], new_taipei: [25.01, 121.47, 11], keelung: [25.13, 121.74, 13],
  taoyuan: [24.99, 121.30, 12], hsinchu: [24.80, 120.97, 12], miaoli: [24.56, 120.82, 11],
  taichung: [24.15, 120.67, 12], changhua: [24.08, 120.54, 12], nantou: [23.91, 120.69, 11],
  yunlin: [23.71, 120.54, 11], chiayi: [23.48, 120.45, 12], tainan: [23.00, 120.23, 12],
  kaohsiung: [22.63, 120.30, 12], pingtung: [22.67, 120.49, 12], yilan: [24.76, 121.75, 12],
  hualien: [23.99, 121.61, 12], taitung: [22.76, 121.14, 12], penghu: [23.57, 119.58, 12],
  kinmen: [24.44, 118.32, 12], matsu: [26.16, 119.95, 12]
};

$('city').innerHTML = '<option value="">' + esc(t('choose')) + '</option>' +
  CITIES.map(function (c) { return '<option value="' + c + '">' + esc(cityName(c)) + '</option>'; }).join('');
$('repeat').innerHTML = '<option value="none">' + esc(t('rep_none')) + '</option><option value="weekly">' + esc(t('rep_weekly')) + '</option>';
$('repeat').onchange = function () {
  var weekly = $('repeat').value === 'weekly';
  $('untilbox').style.display = $('untilhelp').style.display = weekly ? '' : 'none';
};
$('level').innerHTML = LEVELS.map(function (l) { return '<option value="' + l + '">' + esc(levelName(l)) + '</option>'; }).join('');

// ---------- date: an always-visible month calendar ----------
// Native date pickers are scroll wheels on some phones; people think "this Sunday", so show a calendar.
// Dates are 'YYYY-MM-DD' strings, Taiwan time; all math is done in UTC to avoid time zone shifts.

var today = taipeiToday();
var minDate = today;
var maxDate = new Date(Date.parse(today + 'T00:00:00Z') + 182 * 864e5).toISOString().slice(0, 10);
var pickedDate = '';
var calMonth = today.slice(0, 7);  // 'YYYY-MM' being shown
var LOCALE = LANG === 'zh' ? 'zh-TW' : 'en-US';

function utcDate(d) { return new Date(d + 'T00:00:00Z'); }
function fmtUTC(d, opts) { return utcDate(d).toLocaleDateString(LOCALE, Object.assign({ timeZone: 'UTC' }, opts)); }
function shiftMonth(ym, n) {
  var d = new Date(Date.UTC(Number(ym.slice(0, 4)), Number(ym.slice(5, 7)) - 1 + n, 1));
  return d.toISOString().slice(0, 7);
}

function renderCal() {
  var first = calMonth + '-01';
  var startDow = utcDate(first).getUTCDay();  // 0 = Sunday
  var days = new Date(Date.UTC(Number(calMonth.slice(0, 4)), Number(calMonth.slice(5, 7)), 0)).getUTCDate();
  var canPrev = shiftMonth(calMonth, -1) >= minDate.slice(0, 7);
  var canNext = shiftMonth(calMonth, 1) <= maxDate.slice(0, 7);

  var head = '';
  for (var i = 0; i < 7; i++) {  // 2026-01-04 is a Sunday
    head += '<th' + (i === 0 || i === 6 ? ' class="wkend"' : '') + '>' +
      esc(fmtUTC('2026-01-' + ('0' + (4 + i)).slice(-2), { weekday: 'short' })) + '</th>';
  }
  var cells = '', col = 0;
  for (i = 0; i < startDow; i++, col++) cells += '<td></td>';
  for (var day = 1; day <= days; day++, col++) {
    if (col % 7 === 0 && col) cells += '</tr><tr>';
    var d = calMonth + '-' + (day < 10 ? '0' : '') + day;
    var dow = col % 7;
    var cls = [d === pickedDate ? 'picked' : '', d === today ? 'today' : '', dow === 0 || dow === 6 ? 'wkend' : ''].join(' ');
    cells += '<td>' + (d < minDate || d > maxDate
      ? '<span class="off">' + day + '</span>'
      : '<button type="button" class="' + cls + '" data-d="' + d + '">' + day + '</button>') + '</td>';
  }
  for (; col % 7; col++) cells += '<td></td>';

  $('cal').innerHTML =
    '<div class="calhead">' +
      '<button type="button" class="calnav" data-m="-1"' + (canPrev ? '' : ' disabled') + ' aria-label="previous month">◀</button>' +
      '<b>' + esc(fmtUTC(first, { year: 'numeric', month: 'long' })) + '</b>' +
      '<button type="button" class="calnav" data-m="1"' + (canNext ? '' : ' disabled') + ' aria-label="next month">▶</button>' +
    '</div>' +
    '<table><tr>' + head + '</tr><tr>' + cells + '</tr></table>';

  $('cal').querySelectorAll('button[data-d]').forEach(function (b) {
    b.onclick = function () { pickedDate = b.getAttribute('data-d'); renderCal(); showEnd(); };
  });
  $('cal').querySelectorAll('button[data-m]').forEach(function (b) {
    b.onclick = function () { calMonth = shiftMonth(calMonth, Number(b.getAttribute('data-m'))); renderCal(); };
  });
  $('datepicked').textContent = pickedDate
    ? t('date_picked').replace('{date}', fmtUTC(pickedDate, { weekday: 'long', month: 'numeric', day: 'numeric' }))
    : t('pick_date');
}

// ---------- start time: 30-minute steps ----------

function addStartOption(hhmm) {
  var o = document.createElement('option');
  o.value = o.textContent = hhmm;
  $('start').appendChild(o);
}
$('start').innerHTML = '<option value="">' + esc(t('choose')) + '</option>';
for (var m = 6 * 60; m < 24 * 60; m += 30) addStartOption((m < 600 ? '0' : '') + Math.floor(m / 60) + ':' + (m % 60 ? '30' : '00'));

// "YYYY-MM-DDTHH:MM" or '' until both are picked
function whenValue() { return pickedDate && $('start').value ? pickedDate + 'T' + $('start').value : ''; }

// ---------- duration -> end time ----------

function durLabel(mins) {
  var h = Math.floor(mins / 60), m = mins % 60;
  return LANG === 'zh'
    ? (h ? h + ' 小時' : '') + (m ? ' ' + m + ' 分鐘' : '')
    : (h ? h + ' h' : '') + (m ? ' ' + m + ' min' : '');
}
function addDurOption(mins) {
  var o = document.createElement('option');
  o.value = mins;
  o.textContent = durLabel(mins).trim();
  $('duration').appendChild(o);
}
$('duration').innerHTML = '<option value="">' + esc(t('dur_none')) + '</option>';
for (var mins = 30; mins <= 360; mins += 30) addDurOption(mins);
$('duration').value = '120';

function pad(n) { return (n < 10 ? '0' : '') + n; }

// End time as HH:MM, '' for no end, or null if it would run past midnight.
function endTime() {
  var when = whenValue(), dur = Number($('duration').value);
  if (!/T\d\d:\d\d/.test(when) || !dur) return '';
  var total = Number(when.slice(11, 13)) * 60 + Number(when.slice(14, 16)) + dur;
  return total >= 24 * 60 ? null : pad(Math.floor(total / 60)) + ':' + pad(total % 60);
}
function showEnd() {
  var end = endTime();
  $('endsat').innerHTML = end === null ? '<span class="warn">' + esc(t('err_end_midnight')) + '</span>'
    : end ? esc(t('ends_at').replace('{time}', end)) : '&nbsp;';
}
$('start').onchange = $('duration').onchange = showEnd;
renderCal();
showEnd();

// ---------- map ----------

var map = makeMap('map');
var pin = null;
function setPin(ll) {
  if (pin) pin.setLatLng(ll); else pin = dot(ll).addTo(map);
  $('pinstate').textContent = t('pin_set');
}
$('pinstate').textContent = t('pin_missing');
map.on('click', function (e) { setPin(e.latlng); });

$('city').onchange = function () {
  var v = CITY_VIEW[$('city').value];
  if (v) map.setView([v[0], v[1]], v[2]);
};

$('locate').onclick = function () {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(function (p) {
    map.setView([p.coords.latitude, p.coords.longitude], 16);
  });
};

// ---------- edit mode ----------

if (editId && token) {
  $('formtitle').textContent = t('edit_title');
  $('submit').textContent = t('btn_save');
  $('cancel').href = '/event?id=' + encodeURIComponent(editId);
  $('repeatbox').style.display = 'none';  // repeat is chosen when creating
  api('/api/events/' + encodeURIComponent(editId)).then(function (ev) {
    $('title').value = ev.title;
    pickedDate = ev.starts_at.slice(0, 10);
    if (pickedDate < minDate) minDate = pickedDate;  // an already-started pickup can still be edited
    calMonth = pickedDate.slice(0, 7);
    var start = ev.starts_at.slice(11, 16);
    if (!$('start').querySelector('option[value="' + start + '"]')) addStartOption(start);
    $('start').value = start;
    renderCal();
    var dur = '';
    if (ev.ends_at) {
      var toMin = function (s) { return Number(s.slice(11, 13)) * 60 + Number(s.slice(14, 16)); };
      dur = String(toMin(ev.ends_at) - toMin(ev.starts_at));
      if (!$('duration').querySelector('option[value="' + dur + '"]')) addDurOption(Number(dur));
    }
    $('duration').value = dur;
    showEnd();
    $('place').value = ev.place_name;
    $('city').value = ev.city;
    $('level').value = ev.level;
    $('max').value = ev.max_players || '';
    $('min').value = ev.min_players || '';
    $('contact').value = ev.contact;
    $('notes').value = ev.notes;
    if (ev.series_id) $('scopebox').style.display = '';
    setPin([ev.lat, ev.lng]);
    map.setView([ev.lat, ev.lng], 15);
  }).catch(function (err) { showMsg($('errors'), esc(errText(err)), 'err'); });
}

// ---------- submit ----------

$('form').onsubmit = function (e) {
  e.preventDefault();
  var end = endTime();
  if (end === null) {
    showMsg($('errors'), esc(t('err_end_midnight')), 'err');
    return;
  }
  var ll = pin ? pin.getLatLng() : null;
  var when = whenValue();  // "YYYY-MM-DDTHH:MM", always Taiwan time
  var body = {
    title: $('title').value, date: when.slice(0, 10), start: when.slice(11, 16), end: end,
    place_name: $('place').value, city: $('city').value, level: $('level').value,
    max_players: $('max').value, min_players: $('min').value, contact: $('contact').value, notes: $('notes').value,
    lat: ll ? ll.lat : '', lng: ll ? ll.lng : '',
    repeat: $('repeat').value, until: $('until').value,
    scope: (document.querySelector('input[name=scope]:checked') || {}).value
  };
  $('submit').disabled = true;
  $('errors').innerHTML = '';
  var req = editId
    ? api('/api/events/' + encodeURIComponent(editId), { method: 'PUT', body: body, headers: { 'x-edit-token': token } })
        .then(function () { location.href = '/event?id=' + encodeURIComponent(editId); })
    : api('/api/events', { method: 'POST', body: body }).then(function (res) {
        storeSet('edit:' + res.id, res.edit_token);
        if (res.series_id) storeSet('edit-series:' + res.series_id, res.edit_token);
        location.href = '/event?id=' + res.id + '&edit=' + res.edit_token + '&new=1';
      });
  req.catch(function (err) {
    $('submit').disabled = false;
    showMsg($('errors'), (err.errors || ['error']).map(function (k) { return esc(t(k)); }).join('<br>'), 'err');
  });
};
</script>
</body>
</html>
